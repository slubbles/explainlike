<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Excalifont; src: url(__HAND__); }
@font-face { font-family: ExplainSans; src: url(__SANS__); font-weight: 200 1000; }
html, body { margin: 0; width: __W__px; height: __H__px; overflow: hidden; background: __BG__; }
#world { position: absolute; inset: 0; width: __W__px; height: __H__px; }
#topband { position: absolute; left: 0; top: 0; width: 100%; height: 200px; background: linear-gradient(__BG__ 62%, transparent); pointer-events: none; }
#heading { position: absolute; left: 84px; top: 52px; font: 64px Excalifont; color: __INK__; }
#headingText { display: inline-block; white-space: nowrap; }
#headingLine { height: 7px; margin-top: 6px; border-radius: 4px; background: __ACCENT__; transform-origin: left; width: 100%; }
#capwrap { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; }
#captions { display: none; max-width: 1500px; padding: 14px 30px 18px; border-radius: 18px; background: __CAPBG__; font: 800 48px/1.25 ExplainSans; color: __CAP__; letter-spacing: 0.2px; }
#captions span { opacity: 0.86; }
#captions span.said { opacity: 1; }
#captions span.on { color: __HI__; opacity: 1; }
#capwrap.placed { right: auto; bottom: auto; width: max-content; text-align: left; }
#capwrap.placed #captions { transform-origin: 50% 0; }
#capwrap.near #captions { font-size: 42px; max-width: 900px; box-shadow: 0 8px 28px rgba(0,0,0,0.35); }
#capwrap.stack #captions { max-width: 380px; }
#capwrap.stack.small #captions { max-width: 300px; font-size: 36px; padding: 10px 20px 13px; border-radius: 14px; }
#card { position: absolute; inset: 0; background: #000; display: none; align-items: center; justify-content: center; }
#cardText { font: 110px Excalifont; color: #fff; text-align: center; max-width: 1600px; }
#barwrap { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: rgba(255,255,255,0.08); }
#bar { height: 100%; width: 0; background: __ACCENT__; }
#brand { position: absolute; right: 44px; top: 46px; font: 800 26px ExplainSans; color: __INK__; opacity: 0.42; letter-spacing: 0.5px; }
#fade { position: absolute; inset: 0; background: __BG__; opacity: 0; pointer-events: none; }
#end { position: absolute; inset: 0; background: __BG__; display: none; flex-direction: column; align-items: center; justify-content: center; color: __INK__; }
#endTitle { font: 96px Excalifont; text-align: center; max-width: 1600px; }
#endLines { margin-top: 30px; font: 700 34px ExplainSans; color: #b9b9b9; text-align: center; line-height: 1.5; }
#endCredit { margin-top: 64px; font: 800 30px ExplainSans; color: #fff; padding: 14px 30px; border-radius: 999px; background: __ACCENT__; }
</style></head><body>
<svg id="world" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 __W__ __H__"></svg>
<div id="topband"></div><div id="heading"><span id="headingText"></span><div id="headingLine"></div></div>
<div id="brand">__BRAND__</div>
<div id="capwrap"><div id="captions"></div></div>
<div id="fade"></div>
<div id="end"><div id="endTitle">__ENDTITLE__</div><div id="endLines">__ENDLINES__</div><div id="endCredit">__CREDIT__</div></div>
<div id="barwrap"><div id="bar"></div></div>
<script>window.FILM = __FILM__;</script>
<script>__STAGE__</script>
</body></html>
