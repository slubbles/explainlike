name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # the render tests encode short clips and capture a page in Chrome (preinstalled on ubuntu-latest)
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the web app
        run: pnpm --filter @explanimate/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # browser tests run the built app with a stand-in pipeline (e2e/fake-cli.mjs): no keys, no cost.
      # They use the Google Chrome that ubuntu-latest ships with, so there is no browser download.
      - name: Browser tests (Playwright)
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
