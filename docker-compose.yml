# Local run: docker compose up --build, then open http://localhost:3000.
# Keys come from .env (copy .env.example first); without a Muse key the pages
# load but /api/health reports ok:false. Data persists in explanimate-data.
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
    volumes:
      - explanimate-data:/data
    restart: unless-stopped

volumes:
  explanimate-data:
